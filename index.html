<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="2人のリスト">
<meta name="theme-color" content="#4A8FD4">
<title>2人のリスト</title>
<style>
/* ===== RESET / BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --blue: #4A8FD4; --blue-light: #EBF3FF; --blue-mid: #2D6FB0;
  --bg: #F5F4F0; --card: #FFFFFF; --border: #E0DDD6;
  --text: #222222; --text-sub: #777777; --text-hint: #AAAAAA;
  --red: #D34545;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --hdr: 44px; --tab: 48px;
}
html, body { height: 100%; font-family: -apple-system, 'Hiragino Sans', sans-serif; background: var(--bg); color: var(--text); overscroll-behavior: none; -webkit-overflow-scrolling: touch; }
body { font-size: 13px; line-height: 1.4; }

/* ===== HEADER & TABS ===== */
.hdr { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding-top: var(--sat); background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 14px; height: calc(var(--hdr) + var(--sat)); }
.hdr-title { font-size: 15px; font-weight: 800; flex: 1; }
.hdr-count { font-size: 11px; font-weight: 700; color: var(--text-sub); background: var(--bg); padding: 3px 8px; border-radius: 12px; }
.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; background: #fff; border-top: 1px solid var(--border); display: flex; padding-bottom: var(--sab); }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: none; border: none; cursor: pointer; color: var(--text-hint); font-size: 9px; font-weight: 700; height: var(--tab); }
.tab.on { color: var(--blue); }
.tab-ico { font-size: 19px; line-height: 1; }

/* ===== MAIN CONTENT & PINTEREST MASONRY ===== */
.main { padding-top: calc(var(--hdr) + var(--sat)); padding-bottom: calc(var(--tab) + var(--sab) + 16px); min-height: 100vh; }
.panel { display: none; padding: 10px; }
.panel.on { display: block; }

.masonry-container { display: flex; align-items: flex-start; gap: 10px; margin-top: 8px; }
.masonry-col { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 0; }

.g-card { background: var(--card); border-radius: 12px; padding: 10px; border: 1px solid var(--border); box-shadow: 0 1px 3px rgba(0,0,0,.04); }
.g-hd { font-size: 13px; font-weight: 800; color: #444; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; border-bottom: 1px solid #F0EDE8; padding-bottom: 6px; }
.g-dot { color: var(--blue); font-size: 10px; }
.g-item { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 12px; }
.g-item:last-child { margin-bottom: 2px; }
.g-chk { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; border: 1.5px solid #CCC; border-radius: 50%; cursor: pointer; }
.g-chk:active { background: #E4E0DA; }
.g-txt { font-size: 13px; font-weight: 700; color: #222; flex: 1; cursor: pointer; word-break: break-all; line-height: 1.35; }
.g-sub { font-size: 10px; color: var(--text-hint); font-weight: 600; margin-top: 3px; }
.g-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.g-tag { font-size: 9px; background: var(--bg); color: var(--text-sub); padding: 2px 6px; border-radius: 4px; }

/* ===== FILTER BAR ===== */
.filter-bar { position: sticky; top: calc(var(--hdr) + var(--sat)); z-index: 80; background: var(--bg); margin: -10px -10px 10px; padding: 6px 10px; border-bottom: 1px solid var(--border); }
.filter-row { display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.filter-row::-webkit-scrollbar { display: none; }
.chip { flex-shrink: 0; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); background: #fff; color: var(--text-sub); font-size: 11px; font-weight: 600; cursor: pointer; }
.chip.on { border-color: var(--blue); background: var(--blue-light); color: var(--blue-mid); font-weight: 800; }
.filter-lbl { flex-shrink: 0; font-size: 10px; font-weight: 800; color: var(--text-hint); }

/* ===== ARCHIVE CARD ===== */
.card { background: var(--card); border-radius: 10px; padding: 10px; margin-bottom: 8px; opacity: .8; border: 1px solid var(--border); }
.card-title { font-size: 13px; font-weight: 700; text-decoration: line-through; color: var(--text-sub); margin-bottom: 6px;}
.btn-undo { width: 100%; background: #F0EDE8; border: none; border-radius: 6px; padding: 8px; font-size: 11px; font-weight: 700; color: #555; cursor: pointer; }
.sec-hd { font-size: 12px; font-weight: 800; color: var(--text-hint); margin: 16px 0 8px; }

/* ===== EMPTY & LOADING ===== */
.empty { display: flex; flex-direction: column; align-items: center; padding: 50px 0; color: var(--text-hint); text-align: center; gap: 8px; }
.empty-ico { font-size: 32px; }
.spin { width: 22px; height: 22px; border: 2.5px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; margin: 40px auto; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== FAB ===== */
.fab { position: fixed; right: 16px; bottom: calc(var(--tab) + var(--sab) + 16px); width: 48px; height: 48px; border-radius: 50%; background: var(--blue); color: #fff; border: none; font-size: 24px; box-shadow: 0 3px 12px rgba(74,143,212,.4); z-index: 200; cursor: pointer; }
.fab:active { transform: scale(.95); }
.fab.hide { display: none; }

/* ===== COMPACT MODAL FORM ===== */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 300; align-items: flex-end; }
.overlay.on { display: flex; }
.sheet { background: #fff; border-radius: 20px 20px 0 0; width: 100%; max-height: 88vh; overflow-y: auto; padding: 0 16px calc(16px + var(--sab)); }
.sheet-handle { width: 36px; height: 4px; background: #DDD; border-radius: 2px; margin: 10px auto 12px; }
.sheet-title { font-size: 15px; font-weight: 800; margin-bottom: 12px; color: #333; }

.fg { margin-bottom: 12px; }
.fg-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.fg-header label { font-size: 11px; font-weight: 800; color: var(--text-sub); }
.lnk-edit { font-size: 11px; font-weight: 700; color: var(--blue); background: none; border: none; padding: 2px 4px; }

.fi, .fta { width: 100%; border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; background: #FAFAF8; outline: none; font-family: inherit; }
.fi:focus, .fta:focus { border-color: var(--blue); background: #fff; }
.fta { resize: vertical; min-height: 48px; } 

.btn-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.cat-btn { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; font-weight: 700; background: #fff; color: #555; cursor: pointer; }
.cat-btn.on { border-color: var(--blue); background: var(--blue-light); color: var(--blue-mid); }
.tag-btn { padding: 5px 10px; border: 1px solid var(--border); border-radius: 20px; font-size: 11px; font-weight: 600; background: #FAFAF8; color: #666; cursor: pointer; }
.tag-btn.on { border-color: var(--blue); background: var(--blue-light); color: var(--blue-mid); font-weight: 700; }
.tag-btn.on::before { content: '✓ '; }

.btn-submit { width: 100%; background: var(--blue); color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 800; margin-top: 4px; cursor: pointer; }
.btn-cancel { width: 100%; background: #F0EDE8; color: var(--text-sub); border: none; border-radius: 10px; padding: 10px; font-size: 12px; font-weight: 700; margin-top: 6px; cursor: pointer; }

/* ===== SETTINGS MODAL ===== */
.mgr-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; min-height: 24px; }
.mgr-pill { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border); padding: 4px 10px; border-radius: 16px; font-size: 12px; background: #FAFAF8; }
.mgr-del { background: none; border: none; color: #999; font-size: 14px; padding: 0 2px; cursor: pointer; }
.add-row { display: flex; gap: 6px; }

/* ===== TOAST ===== */
.toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); background: rgba(30,30,30,0.9); color: #fff; padding: 10px 18px; border-radius: 24px; font-size: 12px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 999; white-space: nowrap; }
.toast.on { opacity: 1; }
</style>
</head>
<body>

<header class="hdr"><span class="hdr-title">2人のリスト 💑</span><span id="hdr-cnt" class="hdr-count"></span></header>
<main class="main">
  <div id="p-wants" class="panel on"><div class="spin"></div></div>
  <div id="p-shopping" class="panel"><div class="spin"></div></div>
  <div id="p-talking" class="panel"><div class="spin"></div></div>
  <div id="p-todo" class="panel"><div class="spin"></div></div>
  <div id="p-restaurant" class="panel"><div class="spin"></div></div>
  <div id="p-archive" class="panel"></div>
</main>
<button id="fab" class="fab" onclick="openForm(null)">＋</button>

<nav class="tabs">
  <button class="tab on" onclick="sw('wants')"><span class="tab-ico">⭐</span>やりたい</button>
  <button class="tab" onclick="sw('shopping')"><span class="tab-ico">🛒</span>買い物</button>
  <button class="tab" onclick="sw('talking')"><span class="tab-ico">💬</span>話すこと</button>
  <button class="tab" onclick="sw('todo')"><span class="tab-ico">✅</span>Todo</button>
  <button class="tab" onclick="sw('restaurant')"><span class="tab-ico">🍽</span>ご飯屋</button>
  <button class="tab" onclick="sw('archive')"><span class="tab-ico">📁</span>完了</button>
</nav>

<div id="ov" class="overlay" onclick="if(event.target===this)closeMod()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div id="sh-title" class="sheet-title"></div>
    <div id="sh-body"></div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwBwT7jAEcrH9R9WrWjlzut-vBHTCxWIRG3bCmiUVWAz2ojJgjBFDnRp4l4G13qu2_4rQ/exec';

const TABS = ['wants','shopping','talking','todo','restaurant','archive'];
const LABELS = {wants:'やりたいこと', shopping:'買い物', talking:'話すこと', todo:'Todo', restaurant:'ご飯屋'};
let cur = 'wants';
let data = { wants:[], shopping:[], talking:[], todo:[], restaurant:[] };
const store = {};
const flt = { wants:[], shopping:[], talking:[], todo:[], restaurant:[] };

// 各タブのデータが読み込み完了したかを管理するフラグ
let loaded = { wants:false, shopping:false, talking:false, todo:false, restaurant:false };

let conf = {
  c_wants: ['お出かけ','おうち','旅行'], t_wants: ['サクッと','雨の日OK','1日がっつり'],
  c_shopping: ['ドラッグストア','スーパー','100均','ネット'], t_shopping: ['日用品','食品','急ぎ'],
  c_talking: ['相談','雑談','予定'], t_talking: ['急ぎ','重要'],
  c_todo: ['手続き','家事','仕事'], t_todo: ['急ぎ','重要'],
  c_restaurant: ['渋谷','新宿','東京'], t_restaurant: ['ランチ','ディナー','居酒屋','カフェ']
};

function srv(action, payload) {
  let url = SCRIPT_URL + '?action=' + encodeURIComponent(action);
  if(payload) url += '&data=' + encodeURIComponent(JSON.stringify(payload));
  return fetch(url).then(r => r.json());
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(m){ const e=document.getElementById('toast'); e.textContent=m; e.classList.add('on'); setTimeout(()=>e.classList.remove('on'),2500); }
function pTags(s){ return String(s||'').split(',').map(x=>x.trim()).filter(Boolean); }
function d2i(iso){ try{const d=new Date(iso); if(isNaN(d.getTime()))return''; return d.toISOString().split('T')[0];}catch(e){return'';} }
function fDate(iso){ try{const d=new Date(iso); if(isNaN(d.getTime()))return''; return `${d.getMonth()+1}/${d.getDate()}`;}catch(e){return'';} }

// ===== 画面描画 =====
function rpTab(tab) {
  if(tab === 'archive') return rpA();
  
  // まだ裏側で読み込み中の場合はスピナーを表示したままにする
  if (!loaded[tab]) {
    document.getElementById('p-'+tab).innerHTML = '<div class="spin"></div>';
    return;
  }
  
  const items = data[tab].filter(i => {
    const name = String(i.Title || i.Name || '').trim();
    if(!name || name.includes('@') || name.startsWith('http')) return false;

    if(tab==='wants') return String(i.Done).toUpperCase() !== 'TRUE';
    if(tab==='shopping') return String(i.Bought).toUpperCase() !== 'TRUE';
    if(tab==='talking') return String(i.Talked).toUpperCase() !== 'TRUE';
    if(tab==='todo') return String(i.Done).toUpperCase() !== 'TRUE';
    if(tab==='restaurant') return String(i.Visited).toUpperCase() !== 'TRUE';
    return true;
  });

  document.getElementById('hdr-cnt').textContent = items.length ? items.length+'件' : '';
  const selTags = flt[tab];
  const filtered = items.filter(i => selTags.every(t => pTags(i.Tags).includes(t)));

  let h = `<div class="filter-bar"><div class="filter-row"><span class="filter-lbl">タグ絞り込み</span>`;
  conf['t_'+tab].forEach(t => {
    h += `<button class="chip ${selTags.includes(t)?'on':''}" onclick="togFlt('${tab}','${esc(t)}')">${esc(t)}</button>`;
  });
  h += `</div></div>`;

  if(!filtered.length) {
    document.getElementById('p-'+tab).innerHTML = h + `<div class="empty"><div class="empty-ico">📭</div><div>アイテムがありません</div></div>`;
    return;
  }

  const map = {};
  filtered.forEach(i => {
    let c = String(i.Category || (tab==='restaurant'?i.Location:'') || '未分類').trim();
    if(!map[c]) map[c] = [];
    map[c].push(i);
  });

  let colHeights = [0, 0];
  let colHtml = ['', ''];

  Object.keys(map).sort((a,b)=>a==='未分類'?1:b==='未分類'?-1:a.localeCompare(b)).forEach(c => {
    let catItems = map[c];
    let card = `<div class="g-card"><div class="g-hd"><span class="g-dot">●</span>${esc(c)}</div>`;
    
    catItems.forEach(i => {
      const tags = pTags(i.Tags).map(t=>`<span class="g-tag">${esc(t)}</span>`).join('');
      let sub = '';
      if(i.Memo) sub += `<div class="g-sub">📝 ${esc(i.Memo)}</div>`;
      if(i.DeadlineDate || i.Deadline) sub += `<div class="g-sub" style="color:var(--red)">🗓 ${fDate(i.DeadlineDate||i.Deadline)}まで</div>`;
      
      card += `<div class="g-item">
              <div class="g-chk" onclick="markDone('${tab}','${i.ID}')"></div>
              <div class="g-txt" onclick="openForm('${i.ID}')">${esc(i.Title||i.Name)}
                <div class="g-tags">${tags}</div>
                ${sub}
              </div>
            </div>`;
    });
    card += `</div>`;

    let targetCol = colHeights[0] <= colHeights[1] ? 0 : 1;
    colHtml[targetCol] += card;
    colHeights[targetCol] += 40 + (catItems.length * 45); 
  });

  h += `<div class="masonry-container"><div class="masonry-col">${colHtml[0]}</div><div class="masonry-col">${colHtml[1]}</div></div>`;
  document.getElementById('p-'+tab).innerHTML = h;
}

function togFlt(tab, tag) {
  const i = flt[tab].indexOf(tag);
  if(i>=0) flt[tab].splice(i,1); else flt[tab].push(tag);
  rpTab(tab);
}

// ===== アーカイブ =====
function rpA() {
  let h = '';
  const makeList = (tab, arr, title, act) => {
    const doneItems = arr.filter(i => String(i[act]).toUpperCase() === 'TRUE' && (i.Title || i.Name));
    if(!doneItems.length) return '';
    return `<div class="sec-hd">${title}（${doneItems.length}件）</div>` + doneItems.map(i=>
      `<div class="card">
        <div class="card-title">${esc(i.Title||i.Name)}</div>
        <button class="btn-undo" onclick="markUndone('${tab}','${i.ID}')">↩ 未完了に戻す</button>
      </div>`).join('');
  };
  h += makeList('wants', data.wants, '⭐ やりたいこと', 'Done');
  h += makeList('shopping', data.shopping, '🛒 買い物', 'Bought');
  h += makeList('talking', data.talking, '💬 話したこと', 'Talked');
  h += makeList('todo', data.todo, '✅ Todo', 'Done');
  h += makeList('restaurant', data.restaurant, '🍽 行ったお店', 'Visited');
  document.getElementById('p-archive').innerHTML = h || '<div class="empty">完了したアイテムがありません</div>';
}

function markDone(tab, id) {
  const item = store[id]; if(!item) return;
  if(tab==='wants') item.Done = 'TRUE';
  if(tab==='shopping') item.Bought = 'TRUE';
  if(tab==='talking') item.Talked = 'TRUE';
  if(tab==='todo') item.Done = 'TRUE';
  if(tab==='restaurant') item.Visited = 'TRUE';
  
  rpTab(tab);
  toast('✓ 完了しました');
  
  const apiMap = {wants:'markWantDone', shopping:'markBought', talking:'markTalked', todo:'markTodoDone', restaurant:'markVisited'};
  srv(apiMap[tab], {id}).catch(() => toast('通信エラー: 保存されませんでした'));
}

function markUndone(tab, id) {
  const item = store[id]; if(!item) return;
  if(tab==='wants') item.Done = 'FALSE';
  if(tab==='shopping') item.Bought = 'FALSE';
  if(tab==='talking') item.Talked = 'FALSE';
  if(tab==='todo') item.Done = 'FALSE';
  if(tab==='restaurant') item.Visited = 'FALSE';
  
  rpA();
  toast('戻しました');
  
  const apiMap = {wants:'markWantUndone', shopping:'markUnbought', talking:'markUntalked', todo:'markTodoUndone', restaurant:'markUnvisited'};
  srv(apiMap[tab], {id}).catch(() => toast('通信エラー'));
}

// ===== コンパクトフォーム =====
function openForm(id) {
  const item = id ? store[id] : {};
  let tab = cur === 'archive' ? 'wants' : cur;
  if(id) {
    if('Done' in item && 'DeadlineDate' in item) tab = 'wants';
    else if('Bought' in item) tab = 'shopping';
    else if('Talked' in item) tab = 'talking';
    else if('Deadline' in item) tab = 'todo';
    else if('Visited' in item) tab = 'restaurant';
  }

  const titleStr = id ? '編集' : '追加';
  document.getElementById('sh-title').textContent = `${LABELS[tab]} を${titleStr}`;
  
  const cKey = 'c_'+tab, tKey = 't_'+tab;
  const cats = conf[cKey] || []; const tags = conf[tKey] || [];
  const curCat = item.Category || item.Location || '';
  const curTags = pTags(item.Tags);

  const cHtml = cats.map(c=>`<button type="button" class="cat-btn ${c===curCat?'on':''}" onclick="selCat(this)">${esc(c)}</button>`).join('');
  const tHtml = tags.map(t=>`<button type="button" class="tag-btn ${curTags.includes(t)?'on':''}" onclick="this.classList.toggle('on')">${esc(t)}</button>`).join('');

  let h = `<input type="hidden" id="f-id" value="${esc(item.ID||'')}"><input type="hidden" id="f-tab" value="${tab}">`;
  const tTitle = tab==='restaurant' ? 'お店の名前' : 'タイトル';
  const tPlcHd = tab==='shopping' && !id ? "例: 牛乳\n卵\n（改行で一括追加）" : "例: 入力してください";
  
  h += `<div class="fg"><div class="fg-header"><label>${tTitle} *</label></div>`;
  if(tab === 'shopping' && !id) {
    h += `<textarea id="f-title" class="fta" placeholder="${tPlcHd}"></textarea>`;
  } else {
    h += `<input id="f-title" class="fi" type="text" value="${esc(item.Title||item.Name||'')}" placeholder="${tPlcHd}">`;
  }
  h += `</div>`;

  h += `<div class="fg">
          <div class="fg-header"><label>カテゴリ（列分け）</label><button class="lnk-edit" onclick="openMgr('${cKey}','カテゴリ')">✏ 編集</button></div>
          <div class="btn-grid" id="f-cats">${cHtml}</div>
        </div>`;
  
  h += `<div class="fg">
          <div class="fg-header"><label>タグ（複数OK）</label><button class="lnk-edit" onclick="openMgr('${tKey}','タグ')">✏ 編集</button></div>
          <div class="btn-grid" id="f-tags">${tHtml}</div>
        </div>`;

  if(tab === 'wants' || tab === 'todo') {
    h += `<div class="fg"><div class="fg-header"><label>期限</label></div><input id="f-dl" class="fi" type="date" value="${d2i(item.DeadlineDate||item.Deadline)}"></div>`;
  }
  if(tab === 'wants' || tab === 'restaurant') {
    h += `<div class="fg"><div class="fg-header"><label>リンク (URL)</label></div><input id="f-url" class="fi" type="url" value="${esc(item.URL||'')}"></div>`;
  }
  h += `<div class="fg"><div class="fg-header"><label>メモ</label></div><textarea id="f-memo" class="fta" style="min-height:40px">${esc(item.Memo||'')}</textarea></div>`;
  h += `<button class="btn-submit" onclick="submitForm()">${titleStr}する</button><button class="btn-cancel" onclick="closeMod()">キャンセル</button>`;
  
  document.getElementById('sh-body').innerHTML = h;
  document.getElementById('ov').classList.add('on');
}

function selCat(btn) {
  document.querySelectorAll('#f-cats .cat-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
}
function closeMod(){ document.getElementById('ov').classList.remove('on'); }

function submitForm() {
  const id = document.getElementById('f-id').value;
  const tab = document.getElementById('f-tab').value;
  const title = document.getElementById('f-title').value.trim();
  if(!title) return toast('タイトルを入力してください');

  const catBtn = document.querySelector('#f-cats .cat-btn.on');
  const cat = catBtn ? catBtn.textContent : '';
  const tags = Array.from(document.querySelectorAll('#f-tags .tag-btn.on')).map(b=>b.textContent);
  
  const memo = document.getElementById('f-memo').value;
  const dl = document.getElementById('f-dl') ? document.getElementById('f-dl').value : '';
  const url = document.getElementById('f-url') ? document.getElementById('f-url').value : '';

  const isEdit = !!id;
  const isShopMulti = tab === 'shopping' && !isEdit && title.includes('\n');
  
  closeMod();
  
  if(isShopMulti) {
    toast('一括追加しています...');
    const titles = title.split('\n').map(t=>t.trim()).filter(Boolean);
    Promise.all(titles.map(t => srv('addShopping', {title:t, category:cat, tags:tags, memo:memo})))
      .then(()=> { toast('追加しました'); loadTab('shopping'); }).catch(()=>toast('エラーが発生しました'));
    return;
  }

  const newId = id || 'temp-' + Date.now();
  const newItem = {
    ID: newId, Title: title, Name: title,
    Category: cat, Location: cat,
    Tags: tags.join(','), Memo: memo,
    DeadlineDate: dl, Deadline: dl, URL: url,
    Done: 'FALSE', Bought: 'FALSE', Talked: 'FALSE', Visited: 'FALSE'
  };

  if (isEdit) {
    const idx = data[tab].findIndex(x => x.ID === id);
    if(idx > -1) data[tab][idx] = { ...data[tab][idx], ...newItem };
  } else {
    data[tab].push(newItem);
  }
  store[newId] = newItem;
  rpTab(tab); 
  toast(isEdit ? '保存しました' : '追加しました');

  const payload = { id: newId, category: cat, tags: tags, memo: memo };
  if(tab==='wants') { payload.title = title; payload.deadlineDate = dl; payload.url = url; }
  else if(tab==='shopping') { payload.title = title; }
  else if(tab==='talking') { payload.title = title; }
  else if(tab==='todo') { payload.title = title; payload.deadline = dl; }
  else if(tab==='restaurant') { payload.name = title; payload.location = cat; payload.url = url; }

  const apiMap = {
    wants: isEdit ? 'updateWant' : 'addWant',
    shopping: isEdit ? 'updateShopping' : 'addShopping',
    talking: isEdit ? 'updateTalking' : 'addTalking',
    todo: isEdit ? 'updateTodo' : 'addTodo',
    restaurant: isEdit ? 'updateRestaurant' : 'addRestaurant'
  };
  srv(apiMap[tab], payload).catch(() => toast('裏側への保存に失敗しました'));
}

// ===== 管理UI =====
let editKey = '';
function openMgr(key, typeName) {
  editKey = key;
  document.getElementById('sh-title').textContent = `${typeName}を編集`;
  renderMgr();
}
function renderMgr() {
  const items = conf[editKey] || [];
  const pills = items.map((t,i) => `<span class="mgr-pill">${esc(t)} <button class="mgr-del" onclick="rmMgr(${i})">×</button></span>`).join('');
  let h = `<div class="mgr-list">${pills||'<span style="color:#aaa;font-size:12px">まだありません</span>'}</div>
           <div class="add-row">
             <input id="mgr-in" class="fi" type="text" placeholder="新しい項目" onkeydown="if(event.key==='Enter')addMgr()">
             <button class="cat-btn" style="background:var(--blue);color:#fff;border:none" onclick="addMgr()">追加</button>
           </div>
           <button class="btn-submit" onclick="saveMgr()">保存して戻る</button>`;
  document.getElementById('sh-body').innerHTML = h;
}
function addMgr() {
  const v = document.getElementById('mgr-in').value.trim();
  if(!v || conf[editKey].includes(v)) return;
  conf[editKey].push(v);
  renderMgr();
}
function rmMgr(i) { conf[editKey].splice(i,1); renderMgr(); }
function saveMgr() {
  toast('設定を保存中...');
  srv('saveTagSettings', conf).then(() => {
    toast('保存しました');
    const parts = editKey.split('_');
    openForm(document.getElementById('f-id') ? document.getElementById('f-id').value : null);
    rpTab(parts[1]);
  });
}

function sw(tab) {
  cur = tab;
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  document.getElementById('p-'+tab).classList.add('on');
  document.querySelectorAll('.tab')[TABS.indexOf(tab)].classList.add('on');
  document.getElementById('fab').classList.toggle('hide', tab==='archive');
  rpTab(tab);
}

// ===== 特定のタブのデータを取得する関数 =====
async function loadTab(tab) {
  if(tab === 'archive') return;
  const apiMap = { wants:'getWants', shopping:'getShopping', talking:'getTalking', todo:'getTodos', restaurant:'getRestaurants' };
  
  try {
    const res = await srv(apiMap[tab]);
    data[tab] = res || [];
    
    // 古いデータ保護（ID付与）
    data[tab].forEach(i => {
      if (!i.ID) i.ID = 'legacy-' + Math.random().toString(36).substr(2, 9);
      store[i.ID] = i;
    });
    
    loaded[tab] = true;
    
    // 取得完了したタイミングで、もしユーザーがそのタブを開いていれば描画する
    if(cur === tab || cur === 'archive') {
      rpTab(cur);
    }
  } catch(e) {
    console.error(tab + 'の読み込みエラー', e);
  }
}

// ===== 爆速・同時スタート処理！ =====
async function loadInit() {
  try {
    const apiMap = { wants:'getWants', shopping:'getShopping', talking:'getTalking', todo:'getTodos', restaurant:'getRestaurants' };
    
    // 1. 【超重要】「タグ設定」と「今開いているタブのデータ」をヨーイドンで同時にリクエスト！（時間が半分になる）
    const [sett, initData] = await Promise.all([
      srv('getTagSettings'),
      srv(apiMap[cur])
    ]);

    // 設定を適用
    if(sett && Object.keys(sett).length > 0) {
      conf.t_wants = sett.wants || sett.t_wants || conf.t_wants;
      conf.c_restaurant = sett.restaurantLocations || sett.c_restaurant || conf.c_restaurant;
      conf.t_restaurant = sett.restaurant || sett.t_restaurant || conf.t_restaurant;
      conf.t_shopping = sett.shopping || sett.t_shopping || conf.t_shopping;
      conf.t_talking = sett.talking || sett.t_talking || conf.t_talking;
      conf.t_todo = sett.todo || sett.t_todo || conf.t_todo;
      Object.keys(conf).forEach(k => { if(sett[k]) conf[k] = sett[k]; });
    }

    // 最初のタブのデータを適用
    data[cur] = initData || [];
    data[cur].forEach(i => {
      if (!i.ID) i.ID = 'legacy-' + Math.random().toString(36).substr(2, 9);
      store[i.ID] = i;
    });
    loaded[cur] = true;

    // 2. ここで画面をズバッと描画！
    rpTab(cur);

    // 3. それが終わったら、ユーザーに見えない裏側でコッソリ他のタブを1つずつ取得しておく
    const allTabs = ['wants','shopping','talking','todo','restaurant'];
    for(let t of allTabs) {
      if(!loaded[t]) {
        await loadTab(t);
      }
    }
  } catch(e) {
    console.error(e);
    toast('通信エラー');
  }
}

// アプリ起動
loadInit();
</script>
