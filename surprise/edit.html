<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>編集モード</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #111; --card: #1e1e1e; --border: #333; --gold: #c9a86c;
  --text: #f0f0f0; --muted: #888; --accent: #4a8fd4;
}
body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; font-size: 14px; padding-bottom: 4rem; }

/* ─── LOCK ─── */
#lock {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  gap: 1rem; z-index: 100;
}
#lock h1 { font-size: 1.2rem; color: var(--gold); }
#lock input {
  background: var(--card); border: 1px solid var(--border); color: var(--text);
  padding: .6rem 1rem; border-radius: 6px; font-size: 1rem; text-align: center;
  width: 200px;
}
#lock button {
  background: var(--gold); color: #111; border: none;
  padding: .6rem 2rem; border-radius: 6px; font-size: .95rem; cursor: pointer;
}
#lock .err { color: #e05555; font-size: .85rem; }

/* ─── HEADER ─── */
.top-bar {
  position: sticky; top: 0; background: rgba(17,17,17,.95);
  backdrop-filter: blur(10px);
  padding: .75rem 1rem; display: flex; align-items: center; gap: .75rem;
  border-bottom: 1px solid var(--border); z-index: 10;
}
.top-bar h2 { flex: 1; font-size: .9rem; color: var(--gold); }
.btn-done {
  background: var(--gold); color: #111; border: none;
  padding: .5rem 1.2rem; border-radius: 6px; font-size: .85rem; cursor: pointer; font-weight: 600;
}

/* ─── MONTH TABS ─── */
.tabs {
  display: flex; overflow-x: auto; gap: .4rem; padding: .75rem 1rem;
  scrollbar-width: none; border-bottom: 1px solid var(--border);
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0; background: var(--card); border: 1px solid var(--border);
  color: var(--muted); padding: .4rem .9rem; border-radius: 20px;
  font-size: .8rem; cursor: pointer; transition: all .2s;
}
.tab.active { background: var(--gold); color: #111; border-color: var(--gold); font-weight: 600; }

/* ─── SECTION ─── */
.section { display: none; padding: 1rem; }
.section.active { display: block; }

.field-label {
  font-size: .72rem; letter-spacing: .1em; color: var(--muted);
  text-transform: uppercase; margin-bottom: .4rem; margin-top: 1.25rem;
}
.field-label:first-child { margin-top: 0; }

textarea {
  width: 100%; background: var(--card); border: 1px solid var(--border);
  color: var(--text); border-radius: 6px; padding: .65rem .8rem;
  font-family: inherit; font-size: .9rem; line-height: 1.6; resize: vertical;
  transition: border-color .2s; min-height: 120px;
}
textarea:focus { outline: none; border-color: var(--gold); }

/* ─── FUTURE ─── */
#future-section { display: none; padding: 1rem; }
#future-section.active { display: block; }
#future-section p { font-size: .85rem; color: var(--muted); margin-bottom: 1rem; line-height: 1.7; }

/* ─── OUTPUT ─── */
#output-wrap {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
  z-index: 200; padding: 1.5rem; display: none; flex-direction: column; gap: 1rem;
}
#output-wrap.show { display: flex; }
#output-wrap h3 { color: var(--gold); font-size: .95rem; }
#output-wrap p  { color: var(--muted); font-size: .82rem; line-height: 1.6; }
#output-box {
  flex: 1; background: var(--card); border: 1px solid var(--border);
  color: var(--text); border-radius: 6px; padding: .75rem; font-size: .72rem;
  font-family: monospace; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
}
.btn-copy {
  background: var(--accent); color: #fff; border: none;
  padding: .65rem 1rem; border-radius: 6px; font-size: .9rem; cursor: pointer;
}
.btn-close-out {
  background: var(--card); color: var(--muted); border: 1px solid var(--border);
  padding: .65rem 1rem; border-radius: 6px; font-size: .9rem; cursor: pointer;
}
</style>
</head>
<body>

<!-- ─── LOCK ─── -->
<div id="lock">
  <h1>🔒 編集モード</h1>
  <input type="password" id="pw-input" placeholder="パスワード" onkeydown="if(event.key==='Enter')checkPw()">
  <button onclick="checkPw()">ログイン</button>
  <p class="err" id="pw-err"></p>
</div>

<!-- ─── MAIN ─── -->
<div id="app" style="display:none">

  <div class="top-bar">
    <h2>編集モード</h2>
    <button class="btn-done" onclick="exportJSON()">完了してコピー</button>
  </div>

  <div class="tabs" id="tabs"></div>

  <div id="sections"></div>

  <div id="future-section">
    <div class="field-label">これからの手紙</div>
    <textarea id="future-text" placeholder="ここに「これからの手紙」を書く&#10;（HTMLタグも使えます：&lt;p&gt;、&lt;br&gt;など）" style="min-height:240px"></textarea>
  </div>

</div>

<!-- ─── OUTPUT MODAL ─── -->
<div id="output-wrap">
  <h3>このテキストをコピーしてClaudeに送ってください</h3>
  <p>「編集完了」と一緒に下のテキストを貼り付けてください。Claudeがサイトに反映します。</p>
  <div id="output-box"></div>
  <button class="btn-copy" onclick="copyOutput()">📋 コピーする</button>
  <button class="btn-close-out" onclick="document.getElementById('output-wrap').classList.remove('show')">閉じる</button>
</div>

<script>
const PASSWORD = 'shinpei';

const MONTH_LABELS = [
  '9月','10月','11月','12月','1月','2月','3月','4月','5月','6月','これからの手紙'
];
const MONTH_IDS = [
  '2025-09','2025-10','2025-11','2025-12',
  '2026-01','2026-02','2026-03','2026-04','2026-05','2026-06','future'
];

// Initial data (pulled from index.html)
const INIT = {
  '2025-09': {
    story: `9月15日、仕事終わりに会いに来てくれた！\n初めて会った日ドキドキでうまく喋れなかったのが大きな反省😭\n話してる内容は全然変わらないけど、俺ばっか喋ってたなって\nでもとっても魅力的な人だなって思ったよ！\n\nカワウソカフェと原宿も行ったね！\n昼くらいに会ったはずなのに一瞬で夜になってて本当びっくり…\n話も尽きないしとっても楽しい。飾らないところを褒めてくれるとっても素敵な人だなって思った！！`
  },
  '2025-10': {
    story: `一緒に「国宝」を見て、原宿で迷子になって、渋谷で謎のブランドに出会って、池袋でうろうろして、横浜で夜を過ごした！\n大体予定も決めずに集まって、それでも毎回、はるかといると時間があっという間だった。\nたくさん価値観の話もして、お互いの考え方もたくさん話した。\nそして、遥香じゃなきゃダメなんだなって思った！\n\n告白を受け入れてくれてありがとう。\n人生最後の告白全然かっこつかなかったけど、遥香が喜んでくれたからとても幸せな日になったよ。`
  },
  '2025-11': {
    story: `焼き芋フェス行って、皇居財布が買えなくて、蚤の市行って、謎の公園と出会って、2度と使わない鉄板ルートができた月！！\n\n本当に何してても全部楽しくて、クリスマスの計画も突然の当選の知らせに大幅変更したけど、話してるだけでめちゃくちゃ幸せだった😭\n誰かへの手紙は実際書けなかったけど、いつかスティーブ長野として改めて書きに行くからね👍\n\nそして、突然くれた懐中時計と香水！！\nとっっっても幸せでどこに行くにもつけて行った！\nあの日までは😭😭\n悔しすぎるうううううう絶対にいつかまた買ってみせるよ😭`
  },
  '2025-12': {
    story: `ぶち上げブリュレに出会って、バテレで遥香が泥酔して、有楽町で合鍵を作って、軽井沢で2泊3日して最高のクリスマスを2人で過ごした！！\nとにかく幸せだった……\n\nホテルも食事も教会も入ることのできない湖への散歩も人の別荘をたくさん見て歩いたのも全部最高だった😭\nどの写真を見返しても楽しそうで、本当に遥香と2人で過ごす思い出は平凡な時間もそうじゃない時間もかけがえのない幸せなんだなって改めて思った！\n「これ以上の幸せないかも」って言ってくれたけど、全くこっちのセリフだよ！\nこれからたくさん思い出作ってこれ以上ない幸せをいっぱい経験しようね🥰\n\n財布は一生大切にするね！！`
  },
  '2026-01': {
    story: `初めてちゃんと喧嘩した。そして、人生で1番幸せな誕生日をもらった！\n\n怒らせてしまってとてもごめんだし、喧嘩はとてもとても辛かったけど、何時間もふたりで話し合って、その後に「話し合うたびに好きになってる」って話せるのがめちゃくちゃ幸せだった！\n\nそして、俺の誕生日、めちゃくちゃ祝ってくれてありがとう！！\nぶっっっっっちぎりで人生一幸せな誕生日でした🥰\n渋谷のご飯から始まって、Apple Watch、31、写真、足湯、五反田のワインバー\n全部とびきり幸せで絶対忘れないと思う🥰\nApple Watchはない方が不安になるくらいたっっっくさんつけるようにするね！！\n何よりたくさん考えて色々してくれたことが本当に幸せだったよ🥰\n本当にありがとう！！！`
  },
  '2026-02': {
    story: `お皿屋さんと商店街に行って、食べ放題のナンに苦しんで、チョコケーキをもらって、トキワ亭でベロベロになって、しながわ水族館と出会った月。\n\n本当にただの平凡な日常が遥香と2人なら幸せに感じられるよ！\nときわ亭のあとに鳥貴族に毎回行きたがるのはなぜなのか、いまだにわかりません笑\n\nそして、2人の「当たり前」をひとつずつ話し合っていったよね。\nLINEへの返し方、時間の使い方、価値観の細かいところまでいっぱい話したね。\n慎平のことが大好きだから、一緒にいる未来が見えてるからこそ話したいってちゃんと付き合ってくれたのがとっても嬉しかった。\n遥香にこの先も隣にいて欲しいって改めて確信した月だったかな！`
  },
  '2026-03': {

  '2026-04': {
    story: `就職！忙しくなったけど、それでも毎週会えたね！！\n一週目:お好み焼き\n二週目:エビスバー\n三週目:春巻き\n四週目:もんじゃ焼き\nどう考えても食べすぎたね😭\n遥香と一緒だとついついずっと食べちゃうよ😭\n\nそして、一緒に作った春巻き信じられないくらい美味しかったし、ありえないくらい量あったね😱\n平日何があっても遥香がいてくれれば頑張れるってとっても心強く思えたよ🥰`
  },
  '2026-05': {
    story: `最初で最後（であってほしい😭）別れ話をした…\n正直話し合いの前の記憶がほとんどなくなるくらい辛かった。\nでもお互いに本気で、2人で一緒にいたいと思うからぶつかれたんだなって。\nとてつもなく辛かったけど、しっかり話せてよかったよ！\n多分そのあと行った餃子とビール屋の味だけは2度と忘れないかな笑\n\nそして、嘘みたいに幸せな日常が帰ってきた！\n初めて金曜から日曜まで泊まって、潮干狩りと花火に行った。\nどっちもそこそこ失敗だったはずだけど、遥香となら何してても成功なんだなって🥰`
  },
  '2026-06': {
    story: `台風の日も、豚キムチの日も、百均の日も、全部が大切な記憶。\n「1時間に1回は慎平のことかんがえる」と言ってくれた。\n「宇宙で1番愛してるよ」と言ったら「とっっっても！！だいすき！🥰🥰」と全力で返してくれた。\n\n「いねちゃんとの未来のためにおちんぎんほしいので出社します😭」\n毎日そんなふうに生きてくれているはるかが、俺の誇りです。`
  },
  'future': { story: '' }
};

/* ─── STATE ─── */
let current = '2025-09';

function checkPw() {
  const val = document.getElementById('pw-input').value;
  if (val === PASSWORD) {
    document.getElementById('lock').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    buildUI();
  } else {
    document.getElementById('pw-err').textContent = 'パスワードが違います';
  }
}

function buildUI() {
  const tabs = document.getElementById('tabs');
  const secs = document.getElementById('sections');

  MONTH_IDS.forEach((id, i) => {
    /* tab */
    const tab = document.createElement('div');
    tab.className = 'tab' + (id === current ? ' active' : '');
    tab.textContent = MONTH_LABELS[i];
    tab.onclick = () => switchTab(id);
    tabs.appendChild(tab);

    if (id === 'future') return;

    /* section */
    const d = INIT[id];
    const sec = document.createElement('div');
    sec.className = 'section' + (id === current ? ' active' : '');
    sec.id = 'sec-' + id;

    sec.innerHTML = `
      <div class="field-label">その月の物語</div>
      <textarea data-story>${d.story}</textarea>
    `;
    secs.appendChild(sec);
  });

  /* future textarea */
  document.getElementById('future-text').value = INIT.future.story || '';
}

function switchTab(id) {
  current = id;
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', MONTH_IDS[i] === id);
  });
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('future-section').classList.remove('active');

  if (id === 'future') {
    document.getElementById('future-section').classList.add('active');
  } else {
    const sec = document.getElementById('sec-' + id);
    if (sec) sec.classList.add('active');
  }
}

function exportJSON() {
  const out = {};
  MONTH_IDS.forEach(id => {
    if (id === 'future') {
      out.future = document.getElementById('future-text').value;
      return;
    }
    const sec = document.getElementById('sec-' + id);
    if (!sec) return;
    const story = sec.querySelector('[data-story]').value;
    out[id] = { story };
  });

  const json = JSON.stringify(out, null, 2);
  document.getElementById('output-box').textContent = json;
  document.getElementById('output-wrap').classList.add('show');
}

function copyOutput() {
  const text = document.getElementById('output-box').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.btn-copy');
    btn.textContent = '✅ コピーしました！';
    setTimeout(() => btn.textContent = '📋 コピーする', 2000);
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
